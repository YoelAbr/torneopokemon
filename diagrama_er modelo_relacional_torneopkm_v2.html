
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; }
#err { color: var(--color-text-danger); font-size: 13px; padding: 8px; display: none; }
</style>
<div id="erd"></div>
<div id="err"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  USUARIOS {
    int id_usuario PK
    varchar username
    varchar password_hash
    varchar rol
  }
  LOGS_ACCESO {
    int id_log PK
    int id_usuario FK
    datetime fecha_hora_login
  }
  JUGADORES {
    int id_usuario PK
    varchar nombre_entrenador
    int puntos_champions
  }
  POKEDEX_COMPETITIVA {
    int id_pokedex PK
    varchar nombre_pokemon
  }
  EQUIPOS_CHAMPIONS {
    int id_equipo PK
    int id_usuario FK
  }
  INTEGRANTES_EQUIPO {
    int id_equipo FK
    int id_pokedex FK
    int slot
  }
  PARTIDOS {
    int id_partido PK
    int id_jugador1 FK
    int id_jugador2 FK
    varchar ronda
  }
  RESULTADOS_CHAMPIONS {
    int id_resultado PK
    int id_partido FK
    int id_ganador FK
    int id_perdedor FK
  }

  USUARIOS ||--o{ LOGS_ACCESO : "registra"
  USUARIOS ||--o| JUGADORES : "es jugador"
  USUARIOS ||--o{ EQUIPOS_CHAMPIONS : "posee"
  EQUIPOS_CHAMPIONS ||--|{ INTEGRANTES_EQUIPO : "contiene"
  POKEDEX_COMPETITIVA ||--o{ INTEGRANTES_EQUIPO : "aparece en"
  JUGADORES ||--o{ PARTIDOS : "juega j1"
  JUGADORES ||--o{ PARTIDOS : "juega j2"
  PARTIDOS ||--o| RESULTADOS_CHAMPIONS : "tiene"
  JUGADORES ||--o{ RESULTADOS_CHAMPIONS : "gana"
  JUGADORES ||--o{ RESULTADOS_CHAMPIONS : "pierde"
`;

try {
  const { svg } = await mermaid.render('erd-svg', diagram);
  document.getElementById('erd').innerHTML = svg;

  document.querySelectorAll('#erd svg .node').forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill','stroke','stroke-width','class','style']) {
      if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });

  document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
    p.setAttribute('stroke', 'none');
  });
} catch(e) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'Error al renderizar: ' + e.message;
}
</script>
